name: weather-etl

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours (UTC)
  workflow_dispatch:        # Manual trigger button

permissions:
  contents: write

concurrency:
  group: weather-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - run: pip install -r requirements.txt

    - run: python etl.py

    - name: Commit refreshed database
      run: |
        git config user.name "etl-bot"
        git config user.email "etl-bot@users.noreply.github.com"
        git add weather.db
        git diff --staged --quiet || git commit -m "data: scheduled weather db refresh"
        git push